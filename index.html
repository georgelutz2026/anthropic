<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      font-family: sans-serif;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 48px 64px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #1a202c;
    }

    p {
      margin-top: 12px;
      color: #718096;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>Welcome to my website.</p>
  </div>
</body>
</html>
